name: Build Windows & macOS Desktop App (Rust + Tauri v2)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_name: windows-x64
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            os_name: macos-arm64
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync disk-report.html to ui/index.html
        shell: bash
        run: |
          mkdir -p ui
          cp disk-report.html ui/index.html

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI v2
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tauri

      - name: Build Tauri v2 Desktop App (${{ matrix.os_name }})
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Prepare Windows Artifacts (.exe + .msi + NSIS setup)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\dev-disk-report.exe" "dist-artifacts\DevDiskReport-Portable-win-x64.exe"
          Get-ChildItem -Path "target\${{ matrix.target }}\release\bundle" -Include "*.msi", "*.exe" -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist-artifacts\" -Force
          }
          Get-ChildItem dist-artifacts

      - name: Prepare macOS Artifacts (.dmg + .app)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cp "target/${{ matrix.target }}/release/dev-disk-report" "dist-artifacts/DevDiskReport-CLI-macos-arm64"
          find "target/${{ matrix.target }}/release/bundle" -name "*.dmg" -exec cp {} dist-artifacts/ \;
          if [ -d "target/${{ matrix.target }}/release/bundle/macos/DevDiskReport.app" ]; then
            tar -czf "dist-artifacts/DevDiskReport-macos-arm64.app.tar.gz" -C "target/${{ matrix.target }}/release/bundle/macos" "DevDiskReport.app"
          fi
          ls -la dist-artifacts

      - name: Upload Build Artifacts (${{ matrix.os_name }})
        uses: actions/upload-artifact@v4
        with:
          name: DevDiskReport-${{ matrix.os_name }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (on push to main or tag)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-latest
          name: "DevDiskReport v2.0.0 (Windows .exe/.msi & macOS .dmg)"
          body: |
            ## 🚀 Bản cài đặt tự động DevDiskReport v2.0.0 (Rust + Tauri v2)
            - **Windows (x64)**:
              - `DevDiskReport-Portable-win-x64.exe`: File chạy trực tiếp không cần cài đặt (Portable).
              - `DevDiskReport_2.0.0_x64-setup.exe` / `.msi`: Bộ cài đặt chuẩn Windows.
            - **macOS (Apple Silicon M1/M2/M3/M4)**:
              - `DevDiskReport_2.0.0_aarch64.dmg`: File cài đặt kéo-thả cho macOS.
              - `DevDiskReport-macos-arm64.app.tar.gz`: Gói ứng dụng `.app`.
          files: dist-artifacts/*
          prerelease: false
          make_latest: true
