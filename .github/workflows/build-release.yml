name: Build Windows & macOS Desktop App (Rust + Tauri v2)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_name: windows-x64
          - platform: macos-latest
            os_name: macos-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync disk-report.html to ui/index.html
        shell: bash
        run: |
          mkdir -p ui
          cp disk-report.html ui/index.html

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI v2 (Prebuilt via npm)
        shell: bash
        run: |
          npm install -g @tauri-apps/cli@^2.0.0
          tauri --version

      - name: Build Windows Desktop App (.exe + .msi + NSIS setup)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          tauri build --ci --bundles msi nsis
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Copy-Item "target\release\dev-disk-report.exe" "dist-artifacts\DevDiskReport-Portable-win-x64.exe" -Force
          if (Test-Path "target\release\bundle") {
            Get-ChildItem -Path "target\release\bundle" -File -Recurse | Where-Object { $_.Extension -in ".msi", ".exe" } | ForEach-Object {
              Copy-Item $_.FullName -Destination "dist-artifacts\" -Force
            }
          }
          Get-ChildItem dist-artifacts

      - name: Build macOS Desktop App (.app + .dmg)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          tauri build --ci --bundles app
          mkdir -p dist-artifacts
          cp "target/release/dev-disk-report" "dist-artifacts/DevDiskReport-Portable-macos-arm64"
          if [ -d "target/release/bundle/macos/DevDiskReport.app" ]; then
            hdiutil create -volname "DevDiskReport" -srcfolder "target/release/bundle/macos/DevDiskReport.app" -ov -format UDZO "dist-artifacts/DevDiskReport_2.0.0_aarch64.dmg"
            tar -czf "dist-artifacts/DevDiskReport-macos-arm64.app.tar.gz" -C "target/release/bundle/macos" "DevDiskReport.app"
          fi
          ls -la dist-artifacts

      - name: Upload Build Artifacts (${{ matrix.os_name }})
        uses: actions/upload-artifact@v4
        with:
          name: DevDiskReport-${{ matrix.os_name }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: build-desktop
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List release files
        run: ls -la release-files

      - name: Create or Update GitHub Release (v2.0.0-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if gh release view v2.0.0-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v2.0.0-latest release-files/* --clobber --repo "${{ github.repository }}"
          else
            gh release create v2.0.0-latest release-files/* \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "DevDiskReport v2.0.0 (Windows .exe/.msi & macOS .dmg)" \
              --notes "Bản cài đặt tự động DevDiskReport v2.0.0 (Rust + Tauri v2) cho Windows (.exe Portable, .msi, NSIS Setup) và macOS (.dmg, .app)." \
              --latest
          fi
