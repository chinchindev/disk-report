[package]
name = "dev-disk-report"
version = "2.0.0"
edition = "2021"
description = "Cross-platform Dev Disk & Environment Scanner for Windows and macOS (Tauri v2)"
authors = ["ChinChin"]
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
walkdir = "2.5"
rayon = "1.10"
chrono = "0.4"
dirs = "5.0"
open = "5.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
